name: sync
description: "Download selected Audible titles (or all), decrypt/remux to m4b with chapters + cover, stage each in R2 and hand it to Rhapsode, which copies it into the library's own storage. Long-running; progress in the job log."

mode_allowed: [async]
idempotent: true

# Sequential per title: about 13 minutes each while titles came as AAX,
# ~5 since AAXC is asked for first (2026-10-16; the R2 upload is then the
# slow step). Rhapsode's delivery runs alongside the next title. 48 h, not 6: the 6 h limit killed liz's 114-title
# "all" sync at title 29 (2026-10-04). A re-run skips titles already in
# data/synced/<account>.json, so a timeout costs time, not work.
timeout_ms: 172800000
# 4 GB, not 1: the 2026-09-02 first run was OOM-killed (cgroup limit) 12 min
# into a ~29 h title — the download's dirty page cache is charged to the
# job's cgroup on top of the python process. The box has 7 GB.
max_memory_mb: 4096
cpu_quota_pct: 200

env_passthrough: []

input_schema:
  type: object
  additionalProperties: false
  required: ["account", "deliver", "path_prefix"]
  properties:
    account:
      type: string
      description: "The node's name for the account (Rhapsode maps each library's names to these)."
      pattern: "^[a-z0-9][a-z0-9-]{0,31}$"
    asins:
      description: "ASINs to sync, or the string \"all\"."
      oneOf:
        - type: array
          items: { type: string }
          maxItems: 500
        - type: string
          enum: ["all"]
    path_prefix:
      type: string
      description: "The book's folder in the library, recorded in synced.json: \"Audible/<library's account name>\"."
      pattern: "^Audible/[a-z0-9][a-z0-9-]{0,31}$"
    redo:
      type: array
      description: "ASINs to download again although synced.json has them (Rhapsode couldn't copy them into storage)."
      items: { type: string }
      maxItems: 500
    deliver:
      type: object
      description: "Where each staged book is posted: Rhapsode's /api/audible-node/staged, with a token good only for this sync."
      additionalProperties: false
      required: ["url", "sync", "token"]
      properties:
        url: { type: string, pattern: "^https?://" }
        sync: { type: string, pattern: "^as_[0-9a-f]{16}$" }
        token: { type: string, pattern: "^[0-9a-f]{64}$" }
    force:
      type: boolean
      default: false
      description: "Re-download titles already recorded as synced."
    quality:
      type: string
      enum: [best, high, normal]
      default: best

output_schema:
  type: object
  required: ["ok"]
  properties:
    ok: { type: boolean }
    error: { type: string }
    account: { type: string }
    done:
      type: array
      items:
        type: object
        properties:
          asin: { type: string }
          title: { type: ["string", "null"] }
          path: { type: string }
          bytes: { type: integer }
          chapters: { type: integer }
    failed:
      type: array
      items:
        type: object
        properties:
          asin: { type: string }
          title: { type: ["string", "null"] }
          error: { type: string }
    skipped:
      type: array
      items: { type: string }

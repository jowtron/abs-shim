name: remove_account
description: "Unlink an Audible account: deletes its auth file, cached library and sync record. Uploaded books are untouched."

mode_allowed: [async]
idempotent: true

timeout_ms: 15000
max_memory_mb: 64
cpu_quota_pct: 50

env_passthrough: []

input_schema:
  type: object
  additionalProperties: false
  required: ["account"]
  properties:
    account:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{0,31}$"

output_schema:
  type: object
  required: ["ok"]
  properties:
    ok: { type: boolean }
    error: { type: string }
    account: { type: string }

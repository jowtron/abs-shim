# wharf project "abbcrawl" — AudioBookBay detail-page backfill for ABS_shim.
#
# Deployed as an ON-DISK project (not registered handlers): its only unit of
# work is a supervised long-running service, which lives in project.toml, so
# there is nothing for the fleet's registered-handler flow to pin. Deploy by
# copying this directory to /srv/wharf/projects/abbcrawl/ on the node,
# writing .env, then `wharf reload-projects`.
#
# Nodes running it (2026-09-03): stereo-nz, wharf-syd-1. NOT stereo-au — ABB
# drops that AU consumer range at TCP level (curl never completes the
# handshake), so it can do this job from no IP it has. Test any new node with
# a single `curl -A '<browser UA>' https://audiobookbay.lu/` before adding it;
# do not loop-probe, ABB firewalls bursts.
#
# Layout:
#   handlers/abb-detail-crawler.py   the service (see its docstring)
#   .env                             SHIM_URL / SHIM_USER / SHIM_PASS / PACE_SECONDS
#
# Cover resizing is a SEPARATE project (../abbcovers): it needs Pillow and a
# few hundred MB of peak RSS, and wharfd's cgroup is capped per box —
# stereo-nz's is 128 MB, which the two services together blew 75 times in an
# hour on 2026-09-03 (wharfd OOM-killed and restarted, taking netprobe and
# cfpbx-stereo's ESL forwarder down with it each time). Keeping them apart is
# what lets a small box run the cheap half and skip the expensive one.
name        = "abbcrawl"
description = "Fetches AudioBookBay detail pages from this node's IP and posts them to the ABS_shim catalogue API for parsing."

# No jobs are ever submitted to this project, so slots only need to cover the
# service itself.
[slots]
total = 1

# A service, not a schedule: the loop is continuous and self-pacing, and a
# per-minute job would produce ~1400 job rows and log files a day for it.
# wharfd restarts it across crashes and its own restarts; stdout lands in the
# journal (journalctl -u wharfd -f).
[[services]]
name = "abb-detail-crawler"
description = "Claims batches of un-fetched ABB posts from the shim, fetches each detail page one every PACE_SECONDS, posts the HTML back."
command = "python3"
args = ["handlers/abb-detail-crawler.py"]
restart = "always"
env_passthrough = ["SHIM_URL", "SHIM_USER", "SHIM_PASS", "NODE_NAME", "PACE_SECONDS", "BATCH", "IDLE_SLEEP"]

